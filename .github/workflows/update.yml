name: FMHY Data Scraper

on:
  schedule:
    # প্রতিদিন রাত ১২টায় স্বয়ংক্রিয়ভাবে স্ক্র্যাপ করবে
    - cron: '0 0 * * *'
  # গিটহাব থেকে ম্যানুয়ালি রান করার অপশন
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Clean Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fmhy_clean_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update clean FMHY data [skip ci]" && git push)
